firebase:
  mountPath: /app/firebase
  secretName: firebase-sa
hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 450Mi
  minReplicas: '1'
image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/notifications-backend
  tag: production-57158b6
networkPolicy:
  allowedServices:
    - user-backend
    - identity-backend
    - order-backend
  enabled: true
replicaCount: 1
resources:
  requests:
    cpu: 200m
    memory: 1280Mi
  limits:
    cpu: 2000m
    memory: 2048Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: production
database:
  hikariMaxPool: 30
  hikariMinIdle: 10
