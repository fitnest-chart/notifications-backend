replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/notifications-service
  tag: "development-89dab38"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
istio:
  enabled: true
  host: "notifications-service"
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/user-service"
      - "cluster.local/ns/fitnest-dev/sa/identity-service"
      - "cluster.local/ns/fitnest-dev/sa/order-service"
      - "cluster.local/ns/fitnest-dev/sa/api-gateway"
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
env:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-shared:5432/fitnest_notifications"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "shared_password_root_123"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_MAIL_HOST: "smtp.gmail.com"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_USERNAME: "fitnestazerbaijan@gmail.com"
  SPRING_MAIL_PASSWORD: "liopkmpxhntalmrz"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  SPRING_MAIL_FROM: "fitnestazerbaijan@gmail.com"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "az.fitnest.*,az.fitnest.identity.model.event"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: "false"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: "az.fitnest.notifications.messaging.NotificationEvent"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  STORAGE_SERVICE_URL: "http://storage-service:8080"
  USE_GRPC_STORAGE: "false"
  STORAGE_GRPC_ADDRESS: "dns:///storage-service.fitnest-dev.svc.cluster.local:9090"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

  APP_FIREBASE_ENABLED: "true"
  APP_FIREBASE_CONFIG_PATH: "/app/firebase/serviceAccountKey.json"
# The following SMS credentials are managed via Kubernetes secrets, not here:
# - SMS_LOGIN
# - SMS_PASSWORD
# - SMS_SENDER
# - LSIM_SMS_BASE_URL
envSecrets:
  SMS_LOGIN:
    secretName: lsim-sms-secret
    secretKey: login
  SMS_PASSWORD:
    secretName: lsim-sms-secret
    secretKey: password
  SMS_SENDER:
    secretName: lsim-sms-secret
    secretKey: sender
  LSIM_SMS_BASE_URL:
    secretName: lsim-sms-secret
    secretKey: base-url
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "az.fitnest.*,az.fitnest.identity.model.event"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: "false"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: "az.fitnest.notifications.messaging.NotificationEvent"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  STORAGE_SERVICE_URL: "http://storage-service:8080"
  # Optional: enable gRPC-based storage client instead of HTTP. When true, set STORAGE_GRPC_ADDRESS.
  USE_GRPC_STORAGE: "false"
  STORAGE_GRPC_ADDRESS: "dns:///storage-service.fitnest-dev.svc.cluster.local:9090"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

  APP_FIREBASE_ENABLED: "true"
  APP_FIREBASE_CONFIG_PATH: "/app/firebase/serviceAccountKey.json"
resources:
  requests:
    cpu: 23m
    memory: 853Mi
  limits:
    cpu: 1000m
    memory: 1312Mi
firebase:
  secretName: firebase-sa
  mountPath: /app/firebase
