apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "fitnest-role"
        vault.hashicorp.com/agent-inject-secret-config: "secrets/data/{{ .Chart.Name }}/{{ .Values.vaultEnv | default "dev" }}"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secrets/data/{{ .Chart.Name }}/{{ .Values.vaultEnv | default "dev" }}" -}}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}
      annotations:
          {{- with secret "secrets/data/{{ .Chart.Name }}/{{ .Values.vaultEnv | default "dev" }}" -}}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}
      annotations:
          {{- with secret "secrets/data/{{ .Chart.Name }}/{{ .Values.vaultEnv | default "dev" }}" -}}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}
