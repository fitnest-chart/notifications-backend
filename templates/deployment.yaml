apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notifications-service.fullname" . }}
  labels:
    {{- include "notifications-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notifications-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notifications-service.selectorLabels" . | nindent 8 }}
      {{- if .Values.istio.enabled }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      serviceAccountName: {{ include "notifications-service.fullname" . }}

      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: notifications-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}

          env:
            - name: SMS_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecrets.SMS_LOGIN.secretName }}
                  key: {{ .Values.envSecrets.SMS_LOGIN.secretKey }}

            - name: SMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecrets.SMS_PASSWORD.secretName }}
                  key: {{ .Values.envSecrets.SMS_PASSWORD.secretKey }}

            - name: SMS_SENDER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecrets.SMS_SENDER.secretName }}
                  key: {{ .Values.envSecrets.SMS_SENDER.secretKey }}

            - name: LSIM_SMS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecrets.LSIM_SMS_BASE_URL.secretName }}
                  key: {{ .Values.envSecrets.LSIM_SMS_BASE_URL.secretKey }}

            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}

            - name: SPRINGDOC_SERVER_URL
              value: {{ .Values.env.SPRINGDOC_SERVER_URL | quote }}

            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.env.SPRING_DATASOURCE_URL | quote }}

            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.env.SPRING_DATASOURCE_USERNAME | quote }}

            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.env.SPRING_DATASOURCE_PASSWORD | quote }}

            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: {{ .Values.env.SPRING_JPA_HIBERNATE_DDL_AUTO | quote }}

            - name: SPRING_MAIL_HOST
              value: {{ .Values.env.SPRING_MAIL_HOST | quote }}

            - name: SPRING_MAIL_PORT
              value: {{ .Values.env.SPRING_MAIL_PORT | quote }}

            - name: SPRING_MAIL_USERNAME
              value: {{ .Values.env.SPRING_MAIL_USERNAME | quote }}

            - name: SPRING_MAIL_PASSWORD
              value: {{ .Values.env.SPRING_MAIL_PASSWORD | quote }}

            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
              value: {{ .Values.env.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH | quote }}

            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
              value: {{ .Values.env.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE | quote }}

            - name: SPRING_MAIL_FROM
              value: {{ .Values.env.SPRING_MAIL_FROM | quote }}

            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.env.SPRING_DATA_REDIS_HOST | quote }}

            - name: SPRING_DATA_REDIS_PORT
              value: {{ .Values.env.SPRING_DATA_REDIS_PORT | quote }}

            - name: SPRING_DATA_REDIS_PASSWORD
              value: {{ .Values.env.SPRING_DATA_REDIS_PASSWORD | quote }}

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.KAFKA_BOOTSTRAP_SERVERS | quote }}

            - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES
              value: {{ .Values.env.SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES | quote }}

            - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS
              value: {{ .Values.env.SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS | quote }}

            - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE
              value: {{ .Values.env.SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE | quote }}

            - name: JWT_SECRET
              value: {{ .Values.env.JWT_SECRET | quote }}

            - name: JWT_ISSUER
              value: {{ .Values.env.JWT_ISSUER | quote }}

            - name: IDENTITY_SERVICE_URL
              value: {{ .Values.env.IDENTITY_SERVICE_URL | quote }}

            - name: USER_SERVICE_URL
              value: {{ .Values.env.USER_SERVICE_URL | quote }}

            - name: STORAGE_SERVICE_URL
              value: {{ .Values.env.STORAGE_SERVICE_URL | quote }}

            - name: USE_GRPC_STORAGE
              value: {{ .Values.env.USE_GRPC_STORAGE | quote }}

            - name: STORAGE_GRPC_ADDRESS
              value: {{ .Values.env.STORAGE_GRPC_ADDRESS | quote }}

            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.env.JAVA_TOOL_OPTIONS | quote }}

            - name: APP_FIREBASE_ENABLED
              value: {{ .Values.env.APP_FIREBASE_ENABLED | quote }}

            - name: APP_FIREBASE_CONFIG_PATH
              value: {{ .Values.env.APP_FIREBASE_CONFIG_PATH | quote }}

          volumeMounts:
            - name: firebase-sa-volume
              mountPath: {{ .Values.firebase.mountPath | quote }}
              readOnly: true

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: firebase-sa-volume
          secret:
            secretName: {{ .Values.firebase.secretName }}