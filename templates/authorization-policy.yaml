{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "notifications-service.fullname" . }}-allow-internal
  labels:
    {{- include "notifications-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "notifications-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  # Allow internal service-to-service calls
  - from:
    - source:
        {{- if .Values.istio.authorization }}
        {{- if .Values.istio.authorization.internalCallers }}
        principals: {{ .Values.istio.authorization.internalCallers | toJson }}
        {{- end }}
        {{- end }}
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/v1/internal/*", "/api/v1/internal/**"]

  # Allow public endpoints (health, docs, and notifications)
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths:
          - "/api/v1/notifications/*"
          - "/api/v1/notifications/**"
          - "/api/v1/sms/*"
          - "/api/v1/sms/**"
          - "/v3/api-docs/*"
          - "/v3/api-docs"
          - "/swagger-ui/*"
          - "/swagger-ui.html"
          - "/actuator/health"
          - "/actuator/health/*"
          - "/health"
{{- end }}
