{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include (printf "%s.fullname" .Chart.Name) . }}-ingress
  labels:
    {{- include (printf "%s.labels" .Chart.Name) . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include (printf "%s.selectorLabels" .Chart.Name) . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from api-gateway pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
        - port: {{ .Values.service.grpcPort }}
          protocol: TCP
{{- if .Values.networkPolicy.allowedServices }}
    # Allow traffic from additional internal services
    - from:
{{- range .Values.networkPolicy.allowedServices }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
{{- end }}
      ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
        - port: {{ $.Values.service.grpcPort }}
          protocol: TCP
{{- end }}
{{- end }}
